<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>o2a-proxy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="popover">
    <!-- 顶部：状态 + 电源开关 -->
    <header class="head">
      <div class="brand">
        <span class="logo" id="logo">⇄</span>
        <div class="brand-txt">
          <div class="title">o2a-proxy</div>
          <div class="sub" id="headSub">代理已停止</div>
        </div>
      </div>
      <div class="head-actions">
        <button type="button" id="addSvcBtn" class="btn btn-sm head-add" title="添加服务">＋ 添加服务</button>
        <button id="floatBtn" class="float-btn" title="悬浮看板：置顶小窗实时查看">◱ 悬浮</button>
      </div>
    </header>

    <!-- 服务切换标签（每个服务一个，自带独立开关） -->
    <div class="svc-bar">
      <div id="svcTabs" class="svc-tabs"></div>
    </div>

    <!-- 未启动信息条（仅停止时显示） -->
    <div id="offHero" class="off-bar">
      <span class="dot off"></span>
      <span id="offMeta">代理未启动 · 端口 :11011 · qwen-plus</span>
      <div class="off-err" id="offErr"></div>
    </div>

    <!-- 运行中信息条（仅运行时显示） -->
    <div id="onBar" class="on-bar" style="display:none">
      <span class="dot"></span>
      <span id="onBarText">运行中 · 127.0.0.1:11011</span>
      <span class="on-tag" id="onTag1m" style="display:none">1M</span>
    </div>

    <!-- 选项卡 -->
    <nav class="tabs">
      <button class="tab active" data-tab="dashboard">统计</button>
      <button class="tab" data-tab="config">配置</button>
    </nav>

    <main>
      <!-- 统计 -->
      <section id="dashboard" class="panel active">
        <!-- 实时调用（仅代理运行中显示） -->
        <div id="liveCard" class="card live-card" style="display:none">
          <div class="live-head">
            <span class="live-title"><span class="live-dot"></span>实时调用</span>
            <span class="live-sum" id="liveSum">等待请求…</span>
          </div>
          <canvas id="liveSpark" class="live-spark"></canvas>
          <div class="live-feed" id="liveFeed"></div>
        </div>

        <div class="stat-table card">
          <div class="st-row st-head">
            <span id="statsScope" class="stats-scope">全部</span><span>本小时</span><span>今日</span><span>本月</span>
          </div>
          <div class="st-row"><span>请求数</span><b id="req0"></b><b id="req1"></b><b id="req2"></b></div>
          <div class="st-row"><span>输入</span><b id="in0"></b><b id="in1"></b><b id="in2"></b></div>
          <div class="st-row"><span>缓存读</span><b id="rd0"></b><b id="rd1"></b><b id="rd2"></b></div>
          <div class="st-row"><span>输出</span><b id="out0"></b><b id="out1"></b><b id="out2"></b></div>
          <div class="st-row"><span>总计</span><b id="total0"></b><b id="total1"></b><b id="total2"></b></div>
          <div class="st-row hit"><span>命中率</span><b id="hit0"></b><b id="hit1"></b><b id="hit2"></b></div>
          <div class="st-row cost"><span>费用</span><b id="cost0"></b><b id="cost1"></b><b id="cost2"></b></div>
        </div>

        <div class="chart-head">
          <div class="seg">
            <button class="seg-btn active" data-range="today">今日</button>
            <button class="seg-btn" data-range="month">本月</button>
          </div>
          <div class="chart-head-right">
            <select id="modelFilter" class="chart-select" title="按模型过滤（今日/本月）"></select>
            <button id="refreshBtn" class="icon-btn" title="刷新">↻</button>
          </div>
        </div>

        <!-- 按模型分组统计（受今日/本月切换控制） -->
        <div id="modelStatsCard" class="card model-stats-card" style="display:none">
          <div class="model-stats-head">
            <span class="model-stats-title" id="modelStatsTitle">今日按模型</span>
            <span class="model-stats-total" id="modelStatsTotal"></span>
          </div>
          <div id="modelStatsList" class="model-stats-list"></div>
        </div>

        <div class="card chart-box">
          <div class="chart-title" id="chartTitle">缓存命中率 & Token 消耗</div>
          <canvas id="chartCombined"></canvas>
          <div class="chart-note">* 缓存写不支持（当前 API 未返回该字段）</div>
        </div>
        <div id="updatedAt" class="updated">—</div>
      </section>

      <!-- 配置 -->
      <section id="config" class="panel">
        <div id="cfgLock" class="cfg-lock" style="display:none">
          <span id="cfgLockText">🔒 该服务运行中，配置已锁定</span>
          <button type="button" id="cfgLockStopBtn" class="btn btn-sm" style="display:none">停止代理以编辑</button>
        </div>
        <form id="configForm">
          <div class="card form-card">
            <div class="fc-h">服务配置 <span id="activeSvcTitle" class="fc-sub"></span></div>
            <div id="svcSingle"></div>
            <div class="model-hint" id="modelHint"></div>
          </div>

          <div class="card form-card">
            <div class="fc-h">全局</div>
            <label>认证令牌 auth_token <input name="auth_token" type="text" /></label>
            <label class="inline">
              <input name="cache_stats_enabled" type="checkbox" />
              <span>启用缓存统计</span>
            </label>
            <div class="grid2">
              <label>保留天数 <input name="cache_stats_retention_days" type="number" min="1" max="365" /></label>
              <label>统计目录 <input name="cache_stats_dir" type="text" /></label>
            </div>
          </div>

          <datalist id="modelList"></datalist>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存配置</button>
            <button type="button" id="removeSvcBtn" class="btn btn-danger">删除此服务</button>
            <button type="button" id="openCfgBtn" class="btn">打开 config.json</button>
          </div>
          <p class="hint">每个服务监听各自端口：claude 走 Anthropic 转换，codex 走 OpenAI 透传，均记录统计。填写真实 API Key 后点服务标签上的开关即可启动。</p>
        </form>
      </section>
    </main>

    <footer class="foot">
      <span id="footStatus">—</span>
      <button id="quitBtn" class="link-btn">退出应用</button>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script src="charts.js"></script>
  <script src="live.js"></script>
  <script src="app.js"></script>
</body>
</html>
